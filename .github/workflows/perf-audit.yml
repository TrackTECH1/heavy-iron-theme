name: TrackTECH Performance Audit

# Temporary audit runner only. Do not merge this workflow.
on:
  push:
    branches: [perf-audit-2026-08-22]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit tools
        run: |
          npm install --no-save lighthouse@12 playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Preview smoke tests
        run: |
          cat > /tmp/smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const theme = '190164992312';
          const urls = {
            home: `https://newrubbertrack.com/?preview_theme_id=${theme}&pb=0`,
            genericCollection: `https://newrubbertrack.com/collections/rubber-tracks?preview_theme_id=${theme}&pb=0`,
            machineCollection: `https://newrubbertrack.com/collections/bobcat-t190?preview_theme_id=${theme}&pb=0`,
            product: `https://newrubbertrack.com/products/john-deere-333g-rubber-tracks?preview_theme_id=${theme}&pb=0`
          };
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:844}, deviceScaleFactor:1, isMobile:true, hasTouch:true});
          const page = await context.newPage();
          const results = {};
          for (const [name,url] of Object.entries(urls)) {
            const response = await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1200);
            results[name] = {
              status: response?.status() ?? 0,
              finalUrl: page.url(),
              overflow: await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2),
              canonical: await page.locator('link[rel="canonical"]').getAttribute('href').catch(()=>null),
              title: await page.title(),
              h1Count: await page.locator('h1').count(),
              bodyChars: (await page.locator('body').innerText()).length
            };
          }
          await browser.close();
          console.log(JSON.stringify(results,null,2));
          fs?.writeFileSync?.('preview-smoke.json', JSON.stringify(results,null,2));
          EOF
          python - <<'PY'
          p='/tmp/smoke.mjs'
          s=open(p).read()
          s="import fs from 'fs';\n"+s
          open(p,'w').write(s)
          PY
          node /tmp/smoke.mjs | tee preview-smoke.log

      - name: Run Lighthouse matrix
        continue-on-error: true
        run: |
          mkdir -p lighthouse-results
          declare -A URLS
          URLS[homepage]='https://newrubbertrack.com/?preview_theme_id=190164992312&pb=0'
          URLS[generic-collection]='https://newrubbertrack.com/collections/rubber-tracks?preview_theme_id=190164992312&pb=0'
          URLS[machine-collection]='https://newrubbertrack.com/collections/bobcat-t190?preview_theme_id=190164992312&pb=0'
          URLS[product]='https://newrubbertrack.com/products/john-deere-333g-rubber-tracks?preview_theme_id=190164992312&pb=0'

          for page in homepage generic-collection machine-collection product; do
            for mode in mobile desktop; do
              for run in 1 2 3; do
                out="lighthouse-results/${page}-${mode}-${run}.json"
                echo "=== ${page} ${mode} run ${run} ==="
                if [ "$mode" = "desktop" ]; then
                  npx lighthouse "${URLS[$page]}" --quiet --output=json --output-path="$out" --only-categories=performance,seo --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
                else
                  npx lighthouse "${URLS[$page]}" --quiet --output=json --output-path="$out" --only-categories=performance,seo --preset=perf --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
                fi
              done
            done
          done

      - name: Summarize Lighthouse medians
        if: always()
        run: |
          cat > /tmp/summary.mjs <<'EOF'
          import fs from 'fs';
          import path from 'path';
          const dir='lighthouse-results';
          const pages=['homepage','generic-collection','machine-collection','product'];
          const modes=['mobile','desktop'];
          const median=a=>{const v=a.filter(Number.isFinite).sort((x,y)=>x-y); return v.length?v[Math.floor(v.length/2)]:null};
          const score=(r,id)=>r.categories?.[id]?.score==null?null:Math.round(r.categories[id].score*100);
          const num=(r,id)=>r.audits?.[id]?.numericValue??null;
          const rows=[];
          const diagnostics=[];
          for(const page of pages) for(const mode of modes){
            const reports=[];
            for(let i=1;i<=3;i++){
              const f=path.join(dir,`${page}-${mode}-${i}.json`);
              if(fs.existsSync(f)) reports.push(JSON.parse(fs.readFileSync(f,'utf8')));
            }
            if(!reports.length) continue;
            const vals=id=>reports.map(r=>num(r,id));
            rows.push({
              page,mode,
              performance:median(reports.map(r=>score(r,'performance'))),
              seo:median(reports.map(r=>score(r,'seo'))),
              fcp_ms:Math.round(median(vals('first-contentful-paint'))??0),
              lcp_ms:Math.round(median(vals('largest-contentful-paint'))??0),
              tbt_ms:Math.round(median(vals('total-blocking-time'))??0),
              cls:Number((median(vals('cumulative-layout-shift'))??0).toFixed(3)),
              speed_index_ms:Math.round(median(vals('speed-index'))??0),
              ttfb_ms:Math.round(median(vals('server-response-time'))??0),
              transfer_bytes:Math.round(median(vals('total-byte-weight'))??0),
              dom_nodes:Math.round(median(vals('dom-size'))??0)
            });
            const rep=[...reports].sort((a,b)=>(num(a,'largest-contentful-paint')||0)-(num(b,'largest-contentful-paint')||0))[1];
            const ids=['render-blocking-resources','unused-javascript','unused-css-rules','total-byte-weight','dom-size','largest-contentful-paint-element','lcp-lazy-loaded','prioritize-lcp-image','uses-responsive-images','modern-image-formats','offscreen-images','uses-rel-preconnect','uses-rel-preload','font-display','canonical','is-crawlable','document-title','meta-description','http-status-code'];
            const d={page,mode};
            for(const id of ids){const a=rep.audits?.[id]; if(a)d[id]={score:a.score,numericValue:a.numericValue??null,displayValue:a.displayValue??null,title:a.title};}
            diagnostics.push(d);
          }
          const out={generated_at:new Date().toISOString(),theme_id:'190164992312',rows,diagnostics};
          fs.writeFileSync('lighthouse-summary.json',JSON.stringify(out,null,2));
          console.log('MEDIAN_LIGHTHOUSE_RESULTS_JSON');
          console.log(JSON.stringify(out));
          EOF
          node /tmp/summary.mjs

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracktech-perf-audit-2026-08-26
          path: |
            preview-smoke.json
            preview-smoke.log
            lighthouse-summary.json
            lighthouse-results/*.json
          if-no-files-found: warn
          retention-days: 7
